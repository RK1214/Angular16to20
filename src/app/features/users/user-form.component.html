<mat-card>
  <mat-card-title>
    <div class="flex-row align-start-center gap-12">
      <div>{{ id ? 'Edit user' : 'Create user' }}</div>
      <div class="flex-1 hide-xs show-gt-xs"></div>
      <div class="show-xs hide-gt-xs">
        <button mat-icon-button (click)="router.navigate(['/users'])" matTooltip="Back"><mat-icon>arrow_back</mat-icon></button>
      </div>
    </div>
  </mat-card-title>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="save()" class="flex-row flex-column-xs gap-16">
      <div class="flex-60">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
          <mat-error *ngIf="form.get('name')?.invalid">Name required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" />
          <mat-error *ngIf="form.get('email')?.invalid">Valid email required</mat-error>
        </mat-form-field>
      </div>

      <div class="flex-220px flex-column gap-12">
        <mat-form-field appearance="outline">
          <mat-label>Role</mat-label>
          <input matInput formControlName="role" />
        </mat-form-field>

        <div class="flex-row gap-8 align-center-center">
          <button mat-raised-button type="submit">Save</button>
          <button mat-button type="button" (click)="router.navigate(['/users'])">Cancel</button>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
