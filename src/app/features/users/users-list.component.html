<mat-card>
  <mat-card-title>
    <div fxLayout="row" fxLayoutAlign="space-between center" fxLayoutGap="8px">
      <div>Users</div>
      <div>
        <button mat-raised-button routerLink="/users/new" fxShow.gt-xs>Create user</button>
        <!-- show icon-only button on xs -->
        <button mat-raised-button routerLink="/users/new" fxShow.xs matTooltip="Create user"><mat-icon>add</mat-icon></button>
      </div>
    </div>
  </mat-card-title>

  <mat-card-content>
    <!-- Two-column responsive layout: table on larger screens, card list on xs -->
    <div fxLayout="row" fxLayoutGap="16px">
      <div fxFlex fxShow.gt-xs>
        <table mat-table [dataSource]="users" class="mat-table">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let user"> {{user.id}} </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let user"> {{user.name}} </td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let user"> {{user.email}} </td>
          </ng-container>

          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Role </th>
            <td mat-cell *matCellDef="let user"> {{user.role}} </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let user">
              <div fxLayout="row" fxLayoutGap="8px">
                <button mat-button [routerLink]="['/users', user.id]">Edit</button>
                <button mat-button (click)="deleteUser(user.id)">Delete</button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <!-- card list for xs -->
      <div fxFlex fxShow.xs>
        <div fxLayout="column" fxLayoutGap="12px">
          <mat-card *ngFor="let u of users">
            <mat-card-title>
              <div fxLayout="row" fxLayoutAlign="space-between center">
                <div>{{u.name}}</div>
                <div>
                  <button mat-icon-button [routerLink]="['/users', u.id]" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
                  <button mat-icon-button (click)="deleteUser(u.id)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
                </div>
              </div>
            </mat-card-title>
            <mat-card-content>
              <div>{{u.email}}</div>
              <div fxShow.xs>{{u.role}}</div>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
