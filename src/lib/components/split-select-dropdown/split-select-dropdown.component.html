<mat-form-field class="split-select-dropdown" floatLabel="always">
  <mat-label>{{ label }}</mat-label>

  <mat-select
    [(value)]="selectedValue"
    (selectionChange)="onSelectionChange($event.value)"
    (focus)="onFocus()"
    [disabled]="disabled"
    [required]="required"
    [hideSingleSelectionIndicator]="true">

    <mat-select-trigger>
      <div class="trigger-content" *ngIf="getSelectedOption()">
        <span class="trigger-left">{{ getSelectedOption()?.leftLabel }}</span>
        <span class="trigger-right">{{ getSelectedOption()?.rightLabel }}</span>
      </div>
    </mat-select-trigger>

    <mat-option
      *ngFor="let option of options"
      [value]="option.value"
      [class.selected-option]="isSelected(option.value)">
      <div class="option-split-content">
        <span class="option-left" [class.bold-selected]="isSelected(option.value)">
          {{ option.leftLabel }}
        </span>
        <span class="option-right" [class.bold-selected]="isSelected(option.value)">
          {{ option.rightLabel }}
        </span>
      </div>
      <mat-icon *ngIf="isSelected(option.value)" class="check-icon">check</mat-icon>
    </mat-option>
  </mat-select>

  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
  <mat-error *ngIf="errorMessage">{{ errorMessage }}</mat-error>
</mat-form-field>
