<mat-form-field class="select-dropdown" [class.hide-required-asterisk]="!showRequiredAsterisk" [class.has-value]="selectedValue !== null" floatLabel="always">
  <mat-label>
    {{ label }}
    <span *ngIf="showInfoIcon && selectedValue !== null"
          class="custom-info-icon"
          (click)="openInfoDialog(); $event.stopPropagation()"
          role="button"
          tabindex="0">
    </span>
  </mat-label>

  <mat-select
    [(value)]="selectedValue"
    (selectionChange)="onSelectionChange($event.value)"
    (focus)="onFocus()"
    [disabled]="disabled"
    [required]="required"
    [hideSingleSelectionIndicator]="true"
    [disableOptionCentering]="true"
    #selectElement>

    <mat-option
      *ngFor="let option of options"
      [value]="option"
      [class.selected-option]="isSelected(option)">
      <span class="option-text" [class.bold-selected]="isSelected(option)">
        {{ option.text }}
      </span>
      <mat-icon *ngIf="isSelected(option)" class="check-icon">check</mat-icon>
    </mat-option>
  </mat-select>

  <!-- Custom dropdown arrow button with SVG -->
  <button
    mat-icon-button
    matSuffix
    type="button"
    class="custom-dropdown-arrow"
    disableRipple
    [disabled]="disabled"
    [attr.aria-label]="'Toggle dropdown'">
  </button>

  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
  <mat-error *ngIf="errorMessage">{{ errorMessage }}</mat-error>
</mat-form-field>
