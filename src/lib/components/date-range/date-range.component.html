<div class="date-range-container">
  <!-- Departure Date Field -->
  <mat-form-field class="date-field" floatLabel="always">
    <mat-label>
      {{ departureLabel }}
      <span *ngIf="showInfoIcon && departureControl.value"
            class="custom-info-icon"
            (click)="openInfoDialog(); $event.stopPropagation()"
            role="button"
            tabindex="0">
      </span>
    </mat-label>
    <input
      matInput
      [matDatepicker]="departurePicker"
      [formControl]="departureControl"
      [min]="minDate"
      [matDatepickerFilter]="departureDateFilter"
      (focus)="onDepartureFocus()"
      [disabled]="disabled"
      readonly>
    <mat-datepicker-toggle matSuffix [for]="departurePicker" disableRipple></mat-datepicker-toggle>
    <mat-datepicker
      #departurePicker
      [dateClass]="dateClass"
      (opened)="onDepartureOpened()">
    </mat-datepicker>
  </mat-form-field>

  <!-- Return Date Field -->
  <mat-form-field class="date-field" floatLabel="always">
    <mat-label>
      {{ returnLabel }}
      <span *ngIf="showInfoIcon && returnControl.value"
            class="custom-info-icon"
            (click)="openInfoDialog(); $event.stopPropagation()"
            role="button"
            tabindex="0">
      </span>
    </mat-label>
    <input
      matInput
      [matDatepicker]="returnPicker"
      [formControl]="returnControl"
      [min]="minReturnDate"
      [max]="maxReturnDate"
      [matDatepickerFilter]="returnDateFilter"
      (focus)="onReturnFocus()"
      [disabled]="disabled"
      readonly>
    <mat-datepicker-toggle matSuffix [for]="returnPicker" disableRipple></mat-datepicker-toggle>
    <mat-datepicker
      #returnPicker
      [dateClass]="dateClass"
      (opened)="onReturnOpened()">
    </mat-datepicker>
  </mat-form-field>
</div>
