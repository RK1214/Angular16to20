<mat-form-field class="autocomplete-input" [class.has-error]="shouldShowError()" [class.has-value]="selectedValue !== ''" [class.hide-required-asterisk]="!showRequiredAsterisk">
  <mat-label>
    {{ label }}
    <span *ngIf="showInfoIcon && selectedValue !== ''"
          class="custom-info-icon"
          (click)="openInfoDialog(); $event.stopPropagation()"
          role="button"
          tabindex="0">
    </span>
  </mat-label>

  <input
    matInput
    [formControl]="inputControl"
    [matAutocomplete]="auto"
    [placeholder]="placeholder"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (click)="onInputClick()"
    (keydown)="onInputKeydown($event)"
    [disabled]="disabled"
    [required]="required"
    [errorStateMatcher]="errorStateMatcher">

  <!-- Custom dropdown arrow button with SVG -->
  <button
    mat-icon-button
    matSuffix
    type="button"
    class="custom-dropdown-arrow"
    disableRipple
    (mousedown)="onArrowMouseDown($event)"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    [attr.aria-label]="'Toggle dropdown'">
  </button>

  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayFn"
    (opened)="onPanelOpened()"
    (closed)="onPanelClosed()"
    class="autocomplete-panel">

    <mat-option
      *ngFor="let option of filteredOptions$ | async"
      [value]="option.text"
      [class.selected-option]="isSelected(option)"
      (mousedown)="onOptionMouseDown($event)"
      (click)="onOptionSelected(option)">
      <span class="option-text" [class.bold-selected]="isSelected(option)">
        {{ option.text }}
      </span>
      <mat-icon *ngIf="isSelected(option)" class="check-icon">check</mat-icon>
    </mat-option>

    <mat-option *ngIf="(filteredOptions$ | async)?.length === 0" disabled>
      No results found
    </mat-option>
  </mat-autocomplete>

  <mat-hint *ngIf="hint && !shouldShowError()">{{ hint }}</mat-hint>
  <mat-error>{{ getErrorMessage() }}</mat-error>
</mat-form-field>
