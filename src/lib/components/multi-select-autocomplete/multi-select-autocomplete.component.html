<mat-form-field [appearance]="appearance" class="multi-select-autocomplete" [class.has-error]="shouldShowError()" [class.is-empty]="isFieldEmpty" [class.hide-required-asterisk]="!showRequiredAsterisk">
  <mat-label>
    {{ label }}
    <span *ngIf="showInfoIcon && (selectedItems.length > 0 || isFocused)"
          class="custom-info-icon"
          (click)="openInfoDialog(); $event.stopPropagation()"
          role="button"
          tabindex="0">
    </span>
  </mat-label>

  <!-- Selected items as chips -->
  <mat-chip-grid #chipGrid [errorStateMatcher]="errorStateMatcher" [formControl]="searchControl">
    <mat-chip-row
      *ngFor="let item of selectedItems"
      [removable]="!disabled"
      (removed)="removeItem(item)"
      class="selected-chip">
      {{ item.text }}
      <button matChipRemove *ngIf="!disabled" [attr.aria-label]="'Remove ' + item.text">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip-row>

    <!-- Input for autocomplete -->
    <input
      #input
      [placeholder]="selectedItems.length === 0 ? placeholder : ''"
      [formControl]="searchControl"
      [matChipInputFor]="chipGrid"
      [matAutocomplete]="auto"
      (focus)="onInputFocus()"
      (blur)="onInputBlur()"
      (click)="onInputClick()"
      (keydown)="onInputKeydown($event)"
      (input)="updateEmptyState()"
      [disabled]="disabled"
      autocomplete="off"
      class="chip-input"
    />
  </mat-chip-grid>

  <!-- Dropdown arrow button with custom SVG -->
  <button
    mat-icon-button
    matSuffix
    type="button"
    class="custom-dropdown-arrow"
    (mousedown)="onArrowMouseDown($event)"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    [attr.aria-label]="'Toggle dropdown'">
  </button>

  <!-- Hint text -->
  <!-- <mat-hint *ngIf="hint && !showMaxSelectionError && !shouldShowError()">{{ hint }}</mat-hint> -->

  <!-- Error messages -->
  <mat-error *ngIf="showMaxSelectionError">{{ maxSelectionError }} ({{ selectedItems.length }}/{{ maxSelection }})</mat-error>
  <mat-error>{{ getErrorMessage() }}</mat-error>

  <!-- Autocomplete panel -->
  <mat-autocomplete
    #auto="matAutocomplete"
    (optionSelected)="onOptionSelected($event)"
    (opened)="onPanelOpened()"
    (closed)="onPanelClosed()"
    [displayWith]="getDisplayValue.bind(this)"
    class="multi-select-panel"
    [autoActiveFirstOption]="false">

    <ng-container *ngIf="filteredOptions$ | async as filtered">
      <!-- Grouped options -->
      <ng-container *ngIf="isGrouped(filtered)">
        <ng-container *ngFor="let group of filtered">
          <mat-optgroup [label]="group.name" *ngIf="group.options.length > 0">
            <mat-option
              *ngFor="let option of group.options"
              [value]="option"
              (mousedown)="onOptionMouseDown($event)"
              (touchstart)="onOptionMouseDown($event)"
              class="autocomplete-option">
              {{ option.text }}
            </mat-option>
          </mat-optgroup>
        </ng-container>
      </ng-container>

      <!-- Flat options -->
      <ng-container *ngIf="!isGrouped(filtered)">
        <mat-option
          *ngFor="let option of filtered"
          [value]="option"
          (mousedown)="onOptionMouseDown($event)"
          (touchstart)="onOptionMouseDown($event)"
          class="autocomplete-option">
          {{ option.text }}
        </mat-option>
      </ng-container>

      <!-- No results message -->
      <mat-option *ngIf="filtered.length === 0" disabled>
        No results found
      </mat-option>
    </ng-container>
  </mat-autocomplete>
</mat-form-field>
