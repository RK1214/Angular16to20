<mat-form-field [appearance]="appearance" class="multi-select-autocomplete" [class.has-error]="shouldShowError()" [class.is-empty]="selectedItems.length === 0" [class.hide-required-asterisk]="!showRequiredAsterisk">
  <mat-label>
    {{ label }}
    <mat-icon *ngIf="showInfoIcon" class="info-icon" (click)="openInfoDialog(); $event.stopPropagation()">info</mat-icon>
  </mat-label>

  <!-- Selected items as chips -->
  <mat-chip-grid #chipGrid>
    <mat-chip-row
      *ngFor="let item of selectedItems"
      [removable]="!disabled"
      (removed)="removeItem(item)"
      class="selected-chip">
      {{ item.label }}
      <button matChipRemove *ngIf="!disabled" [attr.aria-label]="'Remove ' + item.label">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip-row>

    <!-- Input for autocomplete -->
    <input
      matInput
      #input
      [placeholder]="selectedItems.length === 0 ? placeholder : ''"
      [formControl]="searchControl"
      [matChipInputFor]="chipGrid"
      [matAutocomplete]="auto"
      (focus)="onInputFocus()"
      (blur)="onInputBlur()"
      (click)="onInputClick()"
      (keydown)="onInputKeydown($event)"
      [disabled]="disabled"
      autocomplete="off"
      class="chip-input"
    />
  </mat-chip-grid>

  <!-- Dropdown arrow icon -->
  <mat-icon
    matSuffix
    class="dropdown-arrow"
    (mousedown)="onArrowMouseDown($event)"
    (click)="toggleDropdown()"
    [class.disabled]="disabled"
    [attr.aria-label]="'Toggle dropdown'">
    arrow_drop_down
  </mat-icon>

  <!-- Hint text -->
  <mat-hint *ngIf="hint && !showMaxSelectionError && !shouldShowError()">{{ hint }}</mat-hint>

  <!-- Autocomplete panel -->
  <mat-autocomplete
    #auto="matAutocomplete"
    (optionSelected)="onOptionSelected($event)"
    (opened)="onPanelOpened()"
    (closed)="onPanelClosed()"
    [displayWith]="getDisplayValue.bind(this)"
    class="multi-select-panel"
    [autoActiveFirstOption]="false">

    <ng-container *ngIf="filteredOptions$ | async as filtered">
      <!-- Grouped options -->
      <ng-container *ngIf="isGrouped(filtered)">
        <ng-container *ngFor="let group of filtered">
          <mat-optgroup [label]="group.name" *ngIf="group.options.length > 0">
            <mat-option
              *ngFor="let option of group.options"
              [value]="option"
              class="autocomplete-option">
              {{ option.label }}
            </mat-option>
          </mat-optgroup>
        </ng-container>
      </ng-container>

      <!-- Flat options -->
      <ng-container *ngIf="!isGrouped(filtered)">
        <mat-option
          *ngFor="let option of filtered"
          [value]="option"
          class="autocomplete-option">
          {{ option.label }}
        </mat-option>
      </ng-container>

      <!-- No results message -->
      <mat-option *ngIf="filtered.length === 0" disabled>
        No results found
      </mat-option>
    </ng-container>
  </mat-autocomplete>
</mat-form-field>

<!-- External error message display -->
<div *ngIf="showMaxSelectionError || shouldShowError()" class="external-error-message">
  <span *ngIf="showMaxSelectionError">{{ maxSelectionError }} ({{ selectedItems.length }}/{{ maxSelection }})</span>
  <span *ngIf="shouldShowError() && !showMaxSelectionError">{{ errorMessage }}</span>
</div>
