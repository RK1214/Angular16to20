<mat-form-field class="multiline-select-dropdown" [class.hide-required-asterisk]="!showRequiredAsterisk" floatLabel="always">
  <mat-label>
    {{ label }}
    <mat-icon *ngIf="showInfoIcon" class="info-icon" (click)="openInfoDialog(); $event.stopPropagation()">info</mat-icon>
  </mat-label>

  <mat-select
    [(value)]="selectedValue"
    (selectionChange)="onSelectionChange($event.value)"
    (focus)="onFocus()"
    [disabled]="disabled"
    [required]="required"
    [hideSingleSelectionIndicator]="true">

    <mat-select-trigger>
      {{ getSelectedLabel() }}
    </mat-select-trigger>

    <mat-option
      *ngFor="let option of options; let last = last"
      [value]="option"
      [class.selected-option]="isSelected(option)"
      [class.has-separator]="!last">
      <div class="option-content">
        <div class="option-label" [class.bold-selected]="isSelected(option)">
          {{ option.text }}
        </div>
        <div class="option-description">
          {{ option.description }}
        </div>
      </div>
      <mat-icon *ngIf="isSelected(option)" class="check-icon">check</mat-icon>
    </mat-option>
  </mat-select>

  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
  <mat-error *ngIf="errorMessage">{{ errorMessage }}</mat-error>
</mat-form-field>
