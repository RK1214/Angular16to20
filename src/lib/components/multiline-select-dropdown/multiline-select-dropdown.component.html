<mat-form-field class="multiline-select-dropdown" floatLabel="always">
  <mat-label>{{ label }} <mat-icon class="info-icon">info</mat-icon></mat-label>

  <mat-select
    [(value)]="selectedValue"
    (selectionChange)="onSelectionChange($event.value)"
    (focus)="onFocus()"
    [disabled]="disabled"
    [required]="required"
    [hideSingleSelectionIndicator]="true">

    <mat-select-trigger>
      {{ getSelectedLabel() }}
    </mat-select-trigger>

    <mat-option
      *ngFor="let option of options; let last = last"
      [value]="option.value"
      [class.selected-option]="isSelected(option.value)"
      [class.has-separator]="!last">
      <div class="option-content">
        <div class="option-label" [class.bold-selected]="isSelected(option.value)">
          {{ option.label }}
        </div>
        <div class="option-description">
          {{ option.description }}
        </div>
      </div>
      <mat-icon *ngIf="isSelected(option.value)" class="check-icon">check</mat-icon>
    </mat-option>
  </mat-select>

  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>
  <mat-error *ngIf="errorMessage">{{ errorMessage }}</mat-error>
</mat-form-field>
